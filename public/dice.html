<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dice Game - Scratch & Win</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-purple: #1a0033;
            --light-purple: #330066;
            --green: #008751;
            --red: #dc3545;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: var(--deep-purple);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-size: 14px;
        }
        
        .nav-bar {
            background: rgba(0,0,0,0.9);
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .nav-link {
            color: var(--gold);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(212,175,55,0.3);
        }
        
        .game-container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--gold);
            text-align: center;
        }
        
        h1 {
            text-align: center;
            color: var(--gold);
            margin: 0 0 15px 0;
            font-size: 1.5rem;
        }
        
        .promoter-badge {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a0033;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-left: 8px;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: #aaa;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--gold);
        }
        
        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .dice {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 0 20px rgba(212,175,55,0.5);
            transition: 0.2s;
        }
        
        .dice.rolling {
            animation: roll 0.2s infinite;
        }
        
        @keyframes roll {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .bet-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .bet-option {
            background: var(--light-purple);
            border: 1px solid var(--gold);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .bet-option.active {
            background: var(--gold);
            color: black;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            font-size: 16px;
        }
        
        .btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        
        .btn-gold {
            background: var(--gold);
            color: black;
        }
        
        /* WIN POPUP */
        .win-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        
        .win-popup-content {
            background: linear-gradient(135deg, #1a0033, #330066);
            border: 3px solid #d4af37;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            max-width: 350px;
            margin: auto;
            animation: popIn 0.5s ease;
        }
        
        .win-popup-content h2 {
            color: #d4af37;
            font-size: 32px;
            margin: 0;
        }
        
        .win-amount {
            font-size: 42px;
            color: gold;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .win-close {
            background: #d4af37;
            color: black;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @media (max-width: 500px) {
            .dice { width: 70px; height: 70px; font-size: 32px; }
            .btn { padding: 10px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="index.html" class="nav-link">🏠 Lobby</a>
        <a href="game.html" class="nav-link">🎮 Scratch</a>
        <a href="crash.html" class="nav-link">💥 Crash</a>
        <a href="dice.html" class="nav-link active">🎲 Dice</a>
        <a href="slots.html" class="nav-link">🎰 Slots</a>
          <a href="balloon.html" class="nav-link active">🎈 Balloon</a>
        <a href="minesweeper.html" class="nav-link">💣 Minesweeper</a>
        <a href="wheel.html" class="nav-link">🎡 Wheel</a>
        <a href="blackjack.html" class="nav-link">🃏 Blackjack</a>
    </div>

    <div class="game-container">
        <h1>🎲 DICE GAME <span id="promoter-badge" style="display:none;" class="promoter-badge">👑 PROMOTER (Better Payouts)</span></h1>
        
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Balance</div>
                <div class="stat-value">₦<span id="balance">0</span></div>
            </div>
            <div class="stat">
                <div class="stat-label">Bet Amount</div>
                <div class="stat-value">₦<span id="bet-amount">100</span></div>
            </div>
            <div class="stat">
                <div class="stat-label">Multiplier</div>
                <div class="stat-value" id="multiplier">2x</div>
            </div>
        </div>
        
        <div class="bet-options">
            <button class="bet-option" data-bet="100">₦100</button>
            <button class="bet-option" data-bet="500">₦500</button>
            <button class="bet-option" data-bet="1000">₦1,000</button>
            <button class="bet-option" data-bet="5000">₦5,000</button>
            <button class="bet-option" data-bet="10000">₦10,000</button>
        </div>
        
        <div class="dice-container">
            <div class="dice" id="dice1">🎲</div>
            <div class="dice" id="dice2">🎲</div>
        </div>
        
        <div class="bet-options">
            <button class="bet-option" data-prediction="low">📉 Low (2-6)</button>
            <button class="bet-option" data-prediction="mid">⚖️ Mid (7-9)</button>
            <button class="bet-option" data-prediction="high">📈 High (10-12)</button>
            <button class="bet-option" data-prediction="double">🎲 Double (same number)</button>
        </div>
        
        <div class="result" id="result">
            Select your prediction and bet amount
        </div>
        
        <button class="btn" id="roll-btn">🎲 ROLL DICE 🎲</button>
    </div>

    <!-- WIN POPUP -->
    <div id="win-popup" class="win-popup">
        <div class="win-popup-content">
            <div style="font-size: 60px; margin-bottom: 15px;">🎉</div>
            <h2>YOU WON!</h2>
            <div class="win-amount">₦<span id="win-amount">0</span></div>
            <button class="win-close" onclick="closeWinPopup()">CONTINUE →</button>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        let currentUser = null;
        let currentBet = 100;
        let currentPrediction = null;
        let isPromoter = false;
        
        // 🎯 PROMOTER ADVANTAGE: Better multipliers
        const multipliers = {
            low: { min: 2, max: 6, multiplier: 2, promoterMultiplier: 4 },
            mid: { min: 7, max: 9, multiplier: 2, promoterMultiplier: 8 },
            high: { min: 10, max: 12, multiplier: 2, promoterMultiplier: 10 },
            double: { multiplier: 5, promoterMultiplier: 20 }
        };
        
        function showWinPopup(amount) {
            document.getElementById('win-amount').innerText = amount.toLocaleString();
            document.getElementById('win-popup').style.display = 'flex';
            setTimeout(closeWinPopup, 3000);
        }
        
        function closeWinPopup() {
            document.getElementById('win-popup').style.display = 'none';
        }
        
        async function loadUser() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'auth.html'; return; }
            try {
                const res = await fetch(API + '/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    isPromoter = currentUser.isPromoter || false;
                    document.getElementById('balance').innerText = currentUser.balance.toLocaleString();
                    if (isPromoter) {
                        document.getElementById('promoter-badge').style.display = 'inline-block';
                    }
                }
            } catch (err) { console.error(err); }
        }
        
        async function playGame() {
            if (!currentPrediction) {
                alert('Please select a prediction');
                return;
            }
            if (currentBet > currentUser.balance) {
                alert('Insufficient balance');
                return;
            }
            
            const token = localStorage.getItem('token');
            const betRes = await fetch(API + '/game/dice/bet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ amount: currentBet })
            });
            const betData = await betRes.json();
            if (!betData.success) {
                alert(betData.message);
                return;
            }
            
            currentUser.balance = betData.newBalance;
            document.getElementById('balance').innerText = currentUser.balance.toLocaleString();
            
            const dice1El = document.getElementById('dice1');
            const dice2El = document.getElementById('dice2');
            dice1El.classList.add('rolling');
            dice2El.classList.add('rolling');
            
            setTimeout(() => {
                const dice1 = Math.floor(Math.random() * 6) + 1;
                const dice2 = Math.floor(Math.random() * 6) + 1;
                const total = dice1 + dice2;
                const isDouble = dice1 === dice2;
                
                dice1El.classList.remove('rolling');
                dice2El.classList.remove('rolling');
                dice1El.innerHTML = dice1;
                dice2El.innerHTML = dice2;
                
                let win = false;
                let multiplier = 0;
                let message = '';
                
                // 🎯 PROMOTER LOGIC: Better payouts
                if (currentPrediction === 'double') {
                    if (isDouble) {
                        multiplier = isPromoter ? multipliers.double.promoterMultiplier : multipliers.double.multiplier;
                        win = true;
                        message = `🎉 DOUBLE! You rolled ${dice1} & ${dice2}!`;
                    } else {
                        win = false;
                        message = `😞 Not a double. You rolled ${dice1} & ${dice2}.`;
                    }
                } else {
                    const range = multipliers[currentPrediction];
                    if (total >= range.min && total <= range.max) {
                        multiplier = isPromoter ? range.promoterMultiplier : range.multiplier;
                        win = true;
                        message = `🎉 WIN! Total ${total} is in ${currentPrediction.toUpperCase()} range!`;
                    } else {
                        win = false;
                        message = `😞 Total ${total} is not in ${currentPrediction.toUpperCase()} range.`;
                    }
                }
                
                if (win) {
                    const winAmount = currentBet * multiplier;
                    processWin(winAmount, message);
                } else {
                    document.getElementById('result').innerHTML = message;
                    document.getElementById('result').style.color = '#ff8888';
                }
            }, 500);
        }
        
        async function processWin(winAmount, message) {
            const token = localStorage.getItem('token');
            const res = await fetch(API + '/game/dice/win', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ prize: winAmount, bet: currentBet })
            });
            const data = await res.json();
            if (data.success) {
                currentUser.balance = data.newBalance;
                document.getElementById('balance').innerText = currentUser.balance.toLocaleString();
                document.getElementById('result').innerHTML = `${message} You won ₦${winAmount.toLocaleString()}!`;
                document.getElementById('result').style.color = '#d4af37';
                if (winAmount > 0) showWinPopup(winAmount);
            } else {
                alert(data.message);
            }
        }
        
        function initBetButtons() {
            document.querySelectorAll('.bet-option[data-bet]').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.bet-option[data-bet]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentBet = parseInt(btn.dataset.bet);
                    document.getElementById('bet-amount').innerText = currentBet.toLocaleString();
                };
            });
            document.querySelector('.bet-option[data-bet="100"]').classList.add('active');
            
            document.querySelectorAll('.bet-option[data-prediction]').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.bet-option[data-prediction]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPrediction = btn.dataset.prediction;
                    const mult = multipliers[currentPrediction];
                    const finalMult = isPromoter ? mult.promoterMultiplier : mult.multiplier;
                    document.getElementById('multiplier').innerHTML = finalMult + 'x';
                };
            });
            document.querySelector('.bet-option[data-prediction="low"]').classList.add('active');
            currentPrediction = 'low';
        }
        
        document.getElementById('roll-btn').onclick = playGame;
        
        async function init() {
            await loadUser();
            initBetButtons();
        }
        
        init();
    </script>
</body>
</html>
