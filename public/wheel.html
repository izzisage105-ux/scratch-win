<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wheel of Fortune - Scratch & Win</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-purple: #1a0033;
            --light-purple: #330066;
            --green: #008751;
            --red: #dc3545;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: var(--deep-purple);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .nav-bar {
            background: rgba(0,0,0,0.9);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .nav-link {
            color: var(--gold);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.2s;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(212,175,55,0.3);
        }
        
        .game-container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--gold);
            text-align: center;
        }
        
        h1 {
            text-align: center;
            color: var(--gold);
            margin: 0 0 20px 0;
        }
        
        .promoter-badge {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a0033;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-left: 10px;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #aaa;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold);
        }
        
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(212,175,55,0.5);
        }
        
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid var(--gold);
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            z-index: 10;
        }
        
        .spin-btn {
            background: var(--gold);
            color: black;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px auto;
            transition: 0.2s;
        }
        
        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            font-size: 18px;
        }
        
        .prize-highlight {
            color: var(--gold);
            font-size: 24px;
            font-weight: bold;
        }
        
        .bet-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .bet-btn {
            background: var(--light-purple);
            border: 1px solid var(--gold);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .bet-btn.active {
            background: var(--gold);
            color: black;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: var(--deep-purple);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .prize-amount {
            font-size: 48px;
            color: var(--gold);
            font-weight: bold;
            margin: 20px 0;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="index.html" class="nav-link">🏠 Lobby</a>
        <a href="game.html" class="nav-link">🎮 Scratch</a>
        <a href="crash.html" class="nav-link">💥 Crash</a>
        <a href="sudoku.html" class="nav-link">📊 Sudoku</a>
        <a href="minesweeper.html" class="nav-link">💣 Minesweeper</a>
        <a href="wheel.html" class="nav-link active">🎡 Wheel</a>
        <a href="blackjack.html" class="nav-link">🃏 Blackjack</a>
    </div>

    <div class="game-container">
        <h1>🎡 WHEEL OF FORTUNE <span id="promoter-badge" style="display:none;" class="promoter-badge">👑 PROMOTER (Better Odds)</span></h1>
        
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Balance</div>
                <div class="stat-value">₦<span id="balance">0</span></div>
            </div>
            <div class="stat">
                <div class="stat-label">Bet Amount</div>
                <div class="stat-value">₦<span id="bet-amount">100</span></div>
            </div>
            <div class="stat">
                <div class="stat-label">Last Win</div>
                <div class="stat-value">₦<span id="last-win">0</span></div>
            </div>
        </div>
        
        <div class="bet-controls">
            <button class="bet-btn" data-bet="100">₦100</button>
            <button class="bet-btn" data-bet="500">₦500</button>
            <button class="bet-btn" data-bet="1000">₦1,000</button>
            <button class="bet-btn" data-bet="5000">₦5,000</button>
            <button class="bet-btn" data-bet="10000">₦10,000</button>
        </div>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>
        
        <button class="spin-btn" id="spin-btn">🎡 SPIN THE WHEEL 🎡</button>
        
        <div class="result" id="result">
            Click SPIN to play!
        </div>
    </div>
    
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2 id="result-title"></h2>
            <div id="result-message"></div>
            <div class="prize-amount" id="prize-amount"></div>
            <button class="btn btn-primary" id="modal-close">Spin Again</button>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        let currentUser = null;
        let currentBet = 100;
        let isSpinning = false;
        let isPromoter = false;
        
        // 🎯 PROMOTER LOGIC: Better odds - higher chances of big wins
        const getSegments = (isPromoter) => {
            if (isPromoter) {
                return [
                    { name: "₦0", value: 0, color: "#666", probability: 0.05 },
                    { name: "₦100", value: 100, color: "#4caf50", probability: 0.05 },
                    { name: "₦500", value: 500, color: "#2196f3", probability: 0.08 },
                    { name: "₦1,000", value: 1000, color: "#ff9800", probability: 0.10 },
                    { name: "₦2,000", value: 2000, color: "#9c27b0", probability: 0.12 },
                    { name: "₦5,000", value: 5000, color: "#e91e63", probability: 0.12 },
                    { name: "₦10,000", value: 10000, color: "#00bcd4", probability: 0.12 },
                    { name: "₦25,000", value: 25000, color: "#ff5722", probability: 0.12 },
                    { name: "₦50,000", value: 50000, color: "#ffc107", probability: 0.10 },
                    { name: "₦100,000", value: 100000, color: "#d4af37", probability: 0.08 },
                    { name: "JACKPOT!", value: 500000, color: "#ff6b6b", probability: 0.06 }
                ];
            } else {
                return [
                    { name: "₦0", value: 0, color: "#666", probability: 0.25 },
                    { name: "₦100", value: 100, color: "#4caf50", probability: 0.15 },
                    { name: "₦200", value: 200, color: "#2196f3", probability: 0.12 },
                    { name: "₦500", value: 500, color: "#ff9800", probability: 0.10 },
                    { name: "₦1,000", value: 1000, color: "#9c27b0", probability: 0.08 },
                    { name: "₦2,000", value: 2000, color: "#e91e63", probability: 0.07 },
                    { name: "₦5,000", value: 5000, color: "#00bcd4", probability: 0.06 },
                    { name: "₦10,000", value: 10000, color: "#ff5722", probability: 0.05 },
                    { name: "₦25,000", value: 25000, color: "#ffc107", probability: 0.04 },
                    { name: "₦50,000", value: 50000, color: "#d4af37", probability: 0.03 },
                    { name: "₦100,000", value: 100000, color: "#f44336", probability: 0.02 },
                    { name: "JACKPOT!", value: 500000, color: "#ff6b6b", probability: 0.01 }
                ];
            }
        };
        
        let segments = getSegments(false);
        let canvas = document.getElementById('wheelCanvas');
        let ctx = canvas.getContext('2d');
        let currentAngle = 0;
        
        function drawWheel() {
            const size = 500;
            canvas.width = size;
            canvas.height = size;
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = size / 2;
            
            let startAngle = currentAngle;
            const angleStep = (Math.PI * 2) / segments.length;
            
            for (let i = 0; i < segments.length; i++) {
                const endAngle = startAngle + angleStep;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = segments[i].color;
                ctx.fill();
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + angleStep / 2);
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = "bold 14px Arial";
                ctx.fillStyle = "white";
                ctx.shadowBlur = 0;
                ctx.fillText(segments[i].name, radius * 0.7, 0);
                ctx.restore();
                
                startAngle = endAngle;
            }
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fillStyle = "#d4af37";
            ctx.fill();
            ctx.fillStyle = "black";
            ctx.font = "bold 20px Arial";
            ctx.fillText("🎡", centerX - 15, centerY + 8);
        }
        
        async function loadUser() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'auth.html'; return; }
            try {
                const res = await fetch(API + '/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    isPromoter = currentUser.isPromoter || false;
                    segments = getSegments(isPromoter);
                    document.getElementById('balance').innerText = currentUser.balance.toLocaleString();
                    if (isPromoter) {
                        document.getElementById('promoter-badge').style.display = 'inline-block';
                    }
                    drawWheel();
                }
            } catch (err) { console.error(err); }
        }
        
        function spinWheel() {
            if (isSpinning) return;
            
            const random = Math.random();
            let cumulative = 0;
            let selectedIndex = 0;
            
            for (let i = 0; i < segments.length; i++) {
                cumulative += segments[i].probability;
                if (random <= cumulative) {
                    selectedIndex = i;
                    break;
                }
            }
            
            const prize = segments[selectedIndex].value;
            const prizeName = segments[selectedIndex].name;
            
            const spins = 10;
            const finalAngle = (Math.PI * 2 * spins) + (Math.PI * 2 * (selectedIndex / segments.length));
            
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            
            const startTime = performance.now();
            const duration = 3000;
            
            function animateSpin(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const angle = currentAngle + finalAngle * easeOut;
                currentAngle = angle % (Math.PI * 2);
                drawWheel();
                
                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    document.getElementById('spin-btn').disabled = false;
                    processWin(prize, prizeName);
                }
            }
            
            requestAnimationFrame(animateSpin);
        }
        
        async function processWin(prize, prizeName) {
            if (prize === 0) {
                document.getElementById('result').innerHTML = `😞 Sorry! You landed on ${prizeName}. Better luck next time!`;
                document.getElementById('result').style.color = "#ff8888";
                return;
            }
            
            const token = localStorage.getItem('token');
            const res = await fetch(API + '/game/wheel/win', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ prize, bet: currentBet })
            });
            
            const data = await res.json();
            if (data.success) {
                currentUser.balance = data.newBalance;
                document.getElementById('balance').innerText = currentUser.balance.toLocaleString();
                document.getElementById('last-win').innerText = prize.toLocaleString();
                document.getElementById('result').innerHTML = `🎉🎉🎉 CONGRATULATIONS! 🎉🎉🎉<br>You won ${prizeName}! 🎉🎉🎉`;
                document.getElementById('result').style.color = "#d4af37";
                
                if (prize >= 10000) {
                    const modal = document.getElementById('result-modal');
                    document.getElementById('result-title').innerHTML = '🎉 JACKPOT! 🎉';
                    document.getElementById('result-message').innerHTML = `You won ${prizeName}!`;
                    document.getElementById('prize-amount').innerHTML = `₦${prize.toLocaleString()}`;
                    modal.style.display = 'flex';
                }
            } else {
                alert(data.message);
            }
        }
        
        async function placeBet() {
            if (isSpinning) return;
            if (currentUser.balance < currentBet) {
                alert(`Insufficient balance! You need ₦${currentBet.toLocaleString()}`);
                return;
            }
            
            const token = localStorage.getItem('token');
            const res = await fetch(API + '/game/wheel/bet', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ amount: currentBet })
            });
            
            const data = await res.json();
            if (data.success) {
                currentUser.balance = data.newBalance;
                document.getElementById('balance').innerText = currentUser.balance.toLocaleString();
                spinWheel();
            } else {
                alert(data.message);
            }
        }
        
        function initBetButtons() {
            const btns = document.querySelectorAll('.bet-btn');
            btns.forEach(btn => {
                btn.onclick = () => {
                    btns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentBet = parseInt(btn.dataset.bet);
                    document.getElementById('bet-amount').innerText = currentBet.toLocaleString();
                };
            });
            document.querySelector('.bet-btn[data-bet="100"]').classList.add('active');
        }
        
        document.getElementById('spin-btn').onclick = placeBet;
        document.getElementById('modal-close').onclick = () => {
            document.getElementById('result-modal').style.display = 'none';
        };
        
        async function init() {
            await loadUser();
            initBetButtons();
            drawWheel();
        }
        
        init();
    </script>
</body>
</html>
