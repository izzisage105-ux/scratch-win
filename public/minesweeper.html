<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minesweeper - Scratch & Win</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-purple: #1a0033;
            --light-purple: #330066;
            --green: #008751;
            --red: #dc3545;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: var(--deep-purple);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .nav-bar {
            background: rgba(0,0,0,0.9);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .nav-link {
            color: var(--gold);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.2s;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(212,175,55,0.3);
        }
        
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--gold);
        }
        
        h1 {
            text-align: center;
            color: var(--gold);
            margin: 0 0 20px 0;
        }
        
        .promoter-badge {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a0033;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-left: 10px;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #aaa;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold);
        }
        
        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .difficulty-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            background: #333;
            color: white;
        }
        
        .difficulty-btn.active {
            background: var(--gold);
            color: black;
        }
        
        .difficulty-btn.easy.active { background: var(--green); }
        .difficulty-btn.medium.active { background: #ff9800; }
        .difficulty-btn.hard.active { background: #ff5722; }
        .difficulty-btn.expert.active { background: var(--red); }
        
        .minesweeper-grid {
            display: grid;
            background: #222;
            border: 2px solid var(--gold);
            margin: 20px 0;
            gap: 1px;
            background-color: #444;
        }
        
        .cell {
            background: #888;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            font-size: 16px;
        }
        
        .cell.revealed {
            background: #ddd;
            color: #333;
        }
        
        .cell.flagged::before {
            content: "🚩";
            font-size: 20px;
        }
        
        .cell.mine::after {
            content: "💣";
            font-size: 20px;
        }
        
        .cell[data-value="1"] { color: #2196f3; }
        .cell[data-value="2"] { color: var(--green); }
        .cell[data-value="3"] { color: var(--red); }
        .cell[data-value="4"] { color: #9c27b0; }
        .cell[data-value="5"] { color: #ff9800; }
        .cell[data-value="6"] { color: #00bcd4; }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: var(--green);
            color: white;
        }
        
        .btn-secondary {
            background: var(--gold);
            color: black;
        }
        
        .btn-danger {
            background: var(--red);
            color: white;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: var(--deep-purple);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .prize-amount {
            font-size: 48px;
            color: var(--gold);
            font-weight: bold;
            margin: 20px 0;
        }
        
        /* WIN POPUP */
        .win-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        
        .win-popup-content {
            background: linear-gradient(135deg, #1a0033, #330066);
            border: 3px solid #d4af37;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            margin: auto;
            animation: popIn 0.5s ease;
        }
        
        .win-popup-content h2 {
            color: #d4af37;
            font-size: 36px;
            margin: 0;
        }
        
        .win-amount {
            font-size: 48px;
            color: gold;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .win-close {
            background: #d4af37;
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @media (max-width: 600px) {
            .cell { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="index.html" class="nav-link">🏠 Lobby</a>
        <a href="game.html" class="nav-link">🎮 Scratch</a>
        <a href="crash.html" class="nav-link">💥 Crash</a>
        <a href="sudoku.html" class="nav-link">📊 Sudoku</a>
        <a href="minesweeper.html" class="nav-link active">💣 Minesweeper</a>
        <a href="wheel.html" class="nav-link">🎡 Wheel</a>
        <a href="blackjack.html" class="nav-link">🃏 Blackjack</a>
    </div>

    <div class="game-container">
        <h1>💣 MINESWEEPER <span id="promoter-badge" style="display:none;" class="promoter-badge">👑 PROMOTER (40% Fewer Mines)</span></h1>
        
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Balance</div>
                <div class="stat-value">₦<span id="balance">0</span></div>
            </div>
            <div class="stat">
                <div class="stat-label">Entry Fee</div>
                <div class="stat-value">₦<span id="entry-fee">0</span></div>
            </div>
            <div class="stat">
                <div class="stat-label">Prize Pool</div>
                <div class="stat-value">₦<span id="prize-pool">0</span></div>
            </div>
            <div class="stat">
                <div class="stat-label">Mines</div>
                <div class="stat-value"><span id="mines-count">0</span></div>
            </div>
            <div class="stat">
                <div class="stat-label">Flags</div>
                <div class="stat-value"><span id="flags-left">0</span></div>
            </div>
        </div>
        
        <div class="difficulty-selector">
            <button class="difficulty-btn easy" data-diff="easy">🟢 Easy (8x8, 10 mines)</button>
            <button class="difficulty-btn medium" data-diff="medium">🟠 Medium (12x12, 30 mines)</button>
            <button class="difficulty-btn hard" data-diff="hard">🔴 Hard (16x16, 60 mines)</button>
            <button class="difficulty-btn expert" data-diff="expert">⚫ Expert (20x20, 100 mines)</button>
        </div>
        
        <div id="minesweeper-grid" class="minesweeper-grid"></div>
        
        <div class="action-buttons">
            <button class="btn btn-secondary" id="flag-mode-btn">🚩 Flag Mode</button>
            <button class="btn btn-primary" id="new-game-btn">🎲 New Game</button>
            <button class="btn btn-danger" id="reset-btn">⟳ Reset</button>
        </div>
    </div>
    
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2 id="result-title"></h2>
            <div id="result-message"></div>
            <div class="prize-amount" id="prize-amount"></div>
            <button class="btn btn-primary" id="modal-close">Play Again</button>
        </div>
    </div>

    <!-- WIN POPUP -->
    <div id="win-popup" class="win-popup">
        <div class="win-popup-content">
            <div style="font-size: 80px; margin-bottom: 20px;">🎉</div>
            <h2>YOU WON!</h2>
            <div class="win-amount">₦<span id="win-amount">0</span></div>
            <button class="win-close" onclick="closeWinPopup()">CONTINUE →</button>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        let currentUser = null;
        let gameActive = false;
        let flagMode = false;
        let isPromoter = false;
        
        // Game state
        let board = [];
        let revealed = [];
        let flags = [];
        let minesCount = 0;
        let flagsPlaced = 0;
        let cellsRevealed = 0;
        let totalCells = 0;
        
        let currentDifficulty = 'easy';
        
        function showWinPopup(amount) {
            document.getElementById('win-amount').innerText = amount.toLocaleString();
            document.getElementById('win-popup').style.display = 'flex';
            setTimeout(closeWinPopup, 3000);
        }
        
        function closeWinPopup() {
            document.getElementById('win-popup').style.display = 'none';
        }
        
        const difficultySettings = {
            easy: { rows: 8, cols: 8, mines: 10, entryFee: 100, basePrize: 200, multiplier: 1.5 },
            medium: { rows: 12, cols: 12, mines: 30, entryFee: 200, basePrize: 500, multiplier: 2.0 },
            hard: { rows: 16, cols: 16, mines: 60, entryFee: 500, basePrize: 1500, multiplier: 2.5 },
            expert: { rows: 20, cols: 20, mines: 100, entryFee: 1000, basePrize: 3500, multiplier: 3.0 }
        };
        
        async function loadUser() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'auth.html'; return; }
            try {
                const res = await fetch(API + '/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    isPromoter = currentUser.isPromoter || false;
                    document.getElementById('balance').innerText = currentUser.balance.toLocaleString();
                    if (isPromoter) {
                        document.getElementById('promoter-badge').style.display = 'inline-block';
                    }
                }
            } catch (err) { console.error(err); }
        }
        
        function initBoard() {
            const settings = difficultySettings[currentDifficulty];
            let { rows, cols, mines } = settings;
            
            // 🎯 PROMOTER LOGIC: 40% fewer mines
            if (isPromoter) {
                mines = Math.floor(mines * 0.6);
            }
            
            // Initialize empty board
            board = Array(rows).fill().map(() => Array(cols).fill(0));
            revealed = Array(rows).fill().map(() => Array(cols).fill(false));
            flags = Array(rows).fill().map(() => Array(cols).fill(false));
            minesCount = mines;
            flagsPlaced = 0;
            cellsRevealed = 0;
            totalCells = rows * cols;
            
            // Place mines randomly
            let minesPlaced = 0;
            while (minesPlaced < mines) {
                const row = Math.floor(Math.random() * rows);
                const col = Math.floor(Math.random() * cols);
                if (board[row][col] !== -1) {
                    board[row][col] = -1;
                    minesPlaced++;
                }
            }
            
            // Calculate adjacent numbers
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    if (board[i][j] === -1) continue;
                    let count = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            const ni = i + di, nj = j + dj;
                            if (ni >= 0 && ni < rows && nj >= 0 && nj < cols && board[ni][nj] === -1) {
                                count++;
                            }
                        }
                    }
                    board[i][j] = count;
                }
            }
            
            updateUI();
        }
        
        function updateUI() {
            const settings = difficultySettings[currentDifficulty];
            const grid = document.getElementById('minesweeper-grid');
            const { rows, cols } = settings;
            
            grid.style.display = 'grid';
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.style.gap = '1px';
            
            grid.innerHTML = '';
            
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (revealed[i][j]) {
                        cell.classList.add('revealed');
                        if (board[i][j] === -1) {
                            cell.classList.add('mine');
                        } else if (board[i][j] > 0) {
                            cell.setAttribute('data-value', board[i][j]);
                            cell.textContent = board[i][j];
                        } else {
                            cell.textContent = '';
                        }
                    } else if (flags[i][j]) {
                        cell.classList.add('flagged');
                    } else {
                        cell.textContent = '';
                    }
                    
                    cell.onclick = (function(row, col) {
                        return function(e) { handleClick(row, col); };
                    })(i, j);
                    
                    cell.oncontextmenu = (function(row, col) {
                        return function(e) {
                            e.preventDefault();
                            handleRightClick(row, col);
                            return false;
                        };
                    })(i, j);
                    
                    grid.appendChild(cell);
                }
            }
            
            document.getElementById('mines-count').innerText = minesCount;
            document.getElementById('flags-left').innerText = minesCount - flagsPlaced;
        }
        
        function handleClick(row, col) {
            if (!gameActive) return;
            if (revealed[row][col]) return;
            
            if (flagMode) {
                handleRightClick(row, col);
                return;
            }
            
            if (flags[row][col]) return;
            
            if (board[row][col] === -1) {
                gameActive = false;
                revealAllMines();
                updateUI();
                endGame(false, '💥 You hit a mine! Game over.');
                return;
            }
            
            revealCell(row, col);
            updateUI();
            
            const settings = difficultySettings[currentDifficulty];
            if (cellsRevealed === totalCells - minesCount) {
                gameActive = false;
                // 🎯 PROMOTER LOGIC: Prize multiplier
                const promoterMultiplier = isPromoter ? 2.0 : 1.0;
                const prize = settings.basePrize * settings.multiplier * promoterMultiplier;
                endGame(true, '🎉 You cleared all mines! 🎉', prize);
            }
        }
        
        function revealCell(row, col) {
            if (revealed[row][col] || flags[row][col]) return;
            
            revealed[row][col] = true;
            cellsRevealed++;
            
            if (board[row][col] === 0) {
                const settings = difficultySettings[currentDifficulty];
                for (let di = -1; di <= 1; di++) {
                    for (let dj = -1; dj <= 1; dj++) {
                        const ni = row + di, nj = col + dj;
                        if (ni >= 0 && ni < settings.rows && nj >= 0 && nj < settings.cols) {
                            if (!revealed[ni][nj] && !flags[ni][nj]) {
                                revealCell(ni, nj);
                            }
                        }
                    }
                }
            }
        }
        
        function handleRightClick(row, col) {
            if (!gameActive) return;
            if (revealed[row][col]) return;
            
            if (flags[row][col]) {
                flags[row][col] = false;
                flagsPlaced--;
            } else if (flagsPlaced < minesCount) {
                flags[row][col] = true;
                flagsPlaced++;
            }
            
            updateUI();
        }
        
        function revealAllMines() {
            const settings = difficultySettings[currentDifficulty];
            for (let i = 0; i < settings.rows; i++) {
                for (let j = 0; j < settings.cols; j++) {
                    if (board[i][j] === -1) {
                        revealed[i][j] = true;
                    }
                }
            }
        }
        
        async function endGame(isWin, message, prize = 0) {
            if (isWin && prize > 0) {
                const token = localStorage.getItem('token');
                await fetch(API + '/game/minesweeper/win', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ prize, difficulty: currentDifficulty })
                });
                await loadUser();
                // 🎉 Show win popup for every win
                if (prize > 0) showWinPopup(prize);
            }
            
            const modal = document.getElementById('result-modal');
            document.getElementById('result-title').innerHTML = isWin ? '🎉 VICTORY! 🎉' : '💀 GAME OVER 💀';
            document.getElementById('result-message').innerHTML = message;
            document.getElementById('prize-amount').innerHTML = `₦${prize.toLocaleString()}`;
            modal.style.display = 'flex';
        }
        
        async function newGame() {
            const settings = difficultySettings[currentDifficulty];
            
            if (currentUser.balance < settings.entryFee) {
                alert(`Insufficient balance! Need ₦${settings.entryFee} to play ${currentDifficulty.toUpperCase()} mode.`);
                return false;
            }
            
            const token = localStorage.getItem('token');
            const res = await fetch(API + '/game/minesweeper/start', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ difficulty: currentDifficulty, entryFee: settings.entryFee })
            });
            
            const data = await res.json();
            if (data.success) {
                currentUser.balance = data.newBalance;
                document.getElementById('balance').innerText = currentUser.balance.toLocaleString();
                document.getElementById('entry-fee').innerText = settings.entryFee;
                document.getElementById('prize-pool').innerText = settings.basePrize;
                
                gameActive = true;
                initBoard();
                return true;
            } else {
                alert(data.message);
                return false;
            }
        }
        
        function resetGame() {
            if (!gameActive) {
                initBoard();
                gameActive = true;
            } else {
                initBoard();
            }
            updateUI();
        }
        
        function initDifficulty() {
            const btns = document.querySelectorAll('.difficulty-btn');
            btns.forEach(btn => {
                btn.onclick = async () => {
                    btns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentDifficulty = btn.dataset.diff;
                    
                    const settings = difficultySettings[currentDifficulty];
                    document.getElementById('entry-fee').innerText = settings.entryFee;
                    document.getElementById('prize-pool').innerText = settings.basePrize;
                    document.getElementById('mines-count').innerText = isPromoter ? Math.floor(settings.mines * 0.6) : settings.mines;
                    
                    if (gameActive) {
                        if (confirm('Start new game with this difficulty?')) newGame();
                    }
                };
            });
        }
        
        const flagModeBtn = document.getElementById('flag-mode-btn');
        flagModeBtn.onclick = () => {
            flagMode = !flagMode;
            flagModeBtn.style.background = flagMode ? 'var(--red)' : '#333';
            flagModeBtn.textContent = flagMode ? '🔨 Click Mode' : '🚩 Flag Mode';
        };
        
        document.getElementById('new-game-btn').onclick = newGame;
        document.getElementById('reset-btn').onclick = resetGame;
        document.getElementById('modal-close').onclick = () => {
            document.getElementById('result-modal').style.display = 'none';
            newGame();
        };
        
        async function init() {
            await loadUser();
            initDifficulty();
            const settings = difficultySettings.easy;
            document.getElementById('entry-fee').innerText = settings.entryFee;
            document.getElementById('prize-pool').innerText = settings.basePrize;
            document.getElementById('mines-count').innerText = settings.mines;
            gameActive = true;
            initBoard();
        }
        
        init();
    </script>
</body>
</html>
